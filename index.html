/* ===== v1.3.15 KakaoTalk-like Chat UI ===== */
#view-chat{background:#B2C7DA;border-radius:14px;}

.kakao-row{display:flex;gap:8px;max-width:88%;position:relative;/* animation:fadeIn removed for v1.5.16 flicker fix */}
.kakao-row.other{align-self:flex-start;}
.kakao-row.mine{align-self:flex-end;}

.kakao-content{display:flex;flex-direction:column;gap:4px;max-width:100%;}
.kakao-row.mine .kakao-content{align-items:flex-end;}
.kakao-author{font-size:11px;font-weight:800;color:#2C3E50;margin-left:2px;opacity:0.9;}
.kakao-bubble-line{display:flex;align-items:flex-end;gap:6px;}
.kakao-row.mine .kakao-bubble-line{flex-direction:row-reverse;}
.kakao-bubble{padding:9px 12px;border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 1px rgba(0,0,0,0.1);max-width:250px;cursor:pointer;transition:opacity 0.15s;}
.kakao-row.other .kakao-bubble{background:#ffffff;border-top-left-radius:4px;}
.kakao-row.mine .kakao-bubble{background:#FEE500;border-top-right-radius:4px;}
.kakao-bubble:active{opacity:0.75;}
.kakao-meta{display:flex;flex-direction:column;gap:3px;flex-shrink:0;align-items:flex-start;}
.kakao-row.mine .kakao-meta{align-items:flex-end;}
.kakao-time{font-size:10px;color:#4A5A6A;font-weight:600;white-space:nowrap;letter-spacing:-0.2px;}
.kakao-del{background:rgba(0,0,0,0.18);border:none;border-radius:8px;padding:2px 6px;font-size:8.5px;font-weight:800;color:#fff;cursor:pointer;opacity:0;transition:opacity 0.15s;}

/* ===== v1.3.19-21 KakaoTalk Scroll Fix + iPhone 화면 위로 올라감 수정 ===== */
html{height:100%;}
body{
  min-height:100dvh;
  min-height:100vh;
  background:#FFF8F0;
  padding:10px;
  padding-top:max(10px, env(safe-area-inset-top));
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-text-size-adjust:100%;
  display:block;
}
.header{
  text-align:center;
  padding:8px 0 10px;
  flex-shrink:0;
  background:transparent;
  position:relative;
  z-index:10;
}
.device{
  height:calc(100dvh - 70px);
  height:calc(100vh - 70px);
  max-height:calc(100dvh - 70px);
  min-height:400px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  margin:0 auto;
}
.inner{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}
.box{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}
#view-chat{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
  background:#B2C7DA;
  border-radius:14px;
}
#chatList{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}
#view-chat .input-wrap{
  flex-shrink:0;
  position:sticky;
  bottom:0;
  z-index:20;
  background:#fff;
}
#view-todo, #view-set{
  flex:1;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:0;
}
#view-todo .list, #view-set .set-wrap{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  min-height:0;
}
/* iPhone에서도 고정 높이 유지 - 위로 올라감 방지 */
body.iphone-mode{
  min-height:100dvh;
  padding-top:max(8px, env(safe-area-inset-top));
}
body.iphone-mode .device{
  height:calc(100dvh - 60px);
  max-height:calc(100dvh - 60px);
  min-height:420px;
}
body.ipad-mode .device{
  height:calc(100dvh - 80px);
  max-height:calc(100dvh - 80px);
}

/* iPhone 모드에서도 동일하게 고정 */
body.iphone-mode{height:100dvh;overflow:hidden;}
body.iphone-mode .device{flex:1;min-height:0;height:100%;max-height:100%;}
body.iphone-mode .inner{min-height:0;}
body.ipad-mode{height:100dvh;overflow:hidden;}
body.ipad-mode .device{flex:1;min-height:0;height:100%;}





*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#FFF8F0;color:#111827;padding:10px;padding-bottom:100px;}
.header{text-align:center;padding:8px 0 10px;}
.header h1{font-size:22px;font-weight:900;display:inline-block;vertical-align:middle;}
.badge{font-size:9px;font-weight:700;color:#666;background:white;border:1.5px solid #ddd;border-radius:20px;padding:3px 8px;margin-left:8px;vertical-align:middle;display:inline-block;}
.device{max-width:420px;margin:0 auto;background:white;border:5px solid black;border-radius:28px;padding:8px;display:flex;flex-direction:column;min-height:640px;}
.inner{border-radius:18px;padding:10px;display:flex;flex-direction:column;background:#F9FAFB;min-height:600px;flex:1;}
.top{background:black;color:white;border-radius:14px;padding:9px;text-align:center;font-size:11px;font-weight:900;margin-bottom:6px;cursor:pointer;flex-shrink:0;}
.live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;background:#E8F5E9;border:1.5px solid black;border-radius:12px;padding:7px;margin-bottom:6px;flex-shrink:0;}
.dot{width:10px;height:10px;background:#4ADE80;border-radius:50%;animation:pulse 1s infinite;}
.dot.off{background:#FF4444;animation:none;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
.tabs{display:flex;gap:5px;margin-bottom:8px;flex-shrink:0;}
.tab{flex:1;padding:10px;border-radius:18px;font-size:11px;font-weight:900;border:2px solid black;text-align:center;cursor:pointer;}
.tab.on{background:black;color:white;}
.tab.off{background:white;color:black;}
.box{flex:1;display:flex;flex-direction:column;min-height:0;}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:100px;padding:2px;}
.msg{border:2px solid black;border-radius:14px;padding:9px;background:white;position:relative;}
.msg.mine{background:#E3F2FD;border-color:#1976D2;}
.author{font-size:10px;font-weight:900;background:black;color:white;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:4px;}
.author.mine{background:#1976D2;}
.text{font-size:13px;font-weight:700;padding-right:22px;word-break:break-word;white-space:pre-wrap;}
.time{font-size:9px;color:#666;margin-top:3px;}
.del{position:absolute;top:5px;right:5px;background:#FF4444;color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;}
.input-wrap{border:2px solid black;border-radius:18px;padding:10px;background:white;margin-top:auto;flex-shrink:0;position:relative;z-index:10;}
.send-label{font-size:9px;font-weight:900;background:black;color:white;display:inline-block;padding:3px 8px;border-radius:8px;margin-bottom:8px;}
.input-row{display:flex;gap:8px;align-items:center;width:100%;}
.input-row input{flex:1;border:2px solid black;border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700;min-height:44px;min-width:0;outline:none;}
.input-row button{border:2px solid black;background:black;color:white;border-radius:16px;padding:10px 14px;font-weight:900;cursor:pointer;font-size:13px;min-height:44px;min-width:62px;flex-shrink:0;}
.todo{border:2px solid black;border-radius:14px;padding:10px;background:white;display:flex;gap:8px;align-items:center;}
.todo span{flex:1;font-size:12px;font-weight:700;cursor:pointer;word-break:break-word;}

/* ===== v1.3.15 KakaoTalk-like Chat UI ===== */
#view-chat{background:#B2C7DA;border-radius:14px;}

.kakao-bubble{padding:9px 12px;border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 1px rgba(0,0,0,0.1);max-width:250px;cursor:pointer;transition:opacity 0.15s;}
.kakao-row.other .kakao-bubble{background:#ffffff;border-top-left-radius:4px;}

.kakao-row.mine .kakao-meta{align-items:flex-end;}

.kakao-row:hover .kakao-del{opacity:1;}
.date-sep{align-self:center;background:rgba(0,0,0,0.28);color:#fff;font-size:10px;font-weight:800;padding:5px 12px;border-radius:14px;margin:10px 0;letter-spacing:-0.3px;backdrop-filter:blur(4px);}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
    setTimeout(()=>{
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.frequency.value = 1046;
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.4);
    }, 200);
  }catch(e){ console.log('audio error', e); }
}

function compressImage(file, maxSize, quality){
  maxSize = maxSize || 1024;
  quality = quality || 0.7;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxSize || h>maxSize){
          if(w>h){ h = Math.round(h*maxSize/w); w = maxSize; }
          else{ w = Math.round(w*maxSize/h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0,0,w,h);
        canvas.toBlob((blob)=>{
          if(!blob){ reject('compress fail'); return; }
          resolve({blob: blob, dataUrl: canvas.toDataURL('image/webp', quality), width:w, height:h});
        }, 'image/webp', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function cleanupOldData(){
  const NINETY_DAYS = 90*24*60*60*1000;
  const now = Date.now();
  let deleted = 0;
  try{
    for(const msg of data.messages){
      const created = new Date(msg.created_at).getTime();
      if(now - created > NINETY_DAYS){
        if(msg.storagePath){
          try{ await storageRef.child(msg.storagePath).delete(); }catch(e){ console.log('storage delete skip', e.message); }
        }
        try{ await db.ref('family/'+familyId+'/messages/'+msg._key).remove(); deleted++; }catch(e){}
      }
    }
    for(const t of data.todos){
      const created = new Date(t.created_at).getTime();
      if(!t.isRoutine && now - created > NINETY_DAYS){
        try{ await db.ref('family/'+familyId+'/todos/'+t._key).remove(); }catch(e){}
      } else if(t.isRoutine && t.dueDate){
        const due = new Date(t.dueDate).getTime();
        if(now - due > NINETY_DAYS){
          try{ await db.ref('family/'+familyId+'/todos/'+t._key).remove(); }catch(e){}
        }
      }
    }
    // notices도 90일 지난 건 정리
    for(const n of data.notices){
      const created = new Date(n.created_at).getTime();
      if(now - created > NINETY_DAYS){
        try{ await db.ref('family/'+familyId+'/notices/'+n._key).remove(); }catch(e){}
      }
    }
    if(deleted>0){ toast('🧹 90일 지난 메시지 '+deleted+'개 정리됨'); }
  }catch(e){ console.log('cleanup error', e); }
}

// ===== v1.5.2 GitHub PAT Auto Secrets =====
async function pushSecretsToGitHub(){
  const pat = document.getElementById('githubPatInput')?.value.trim() || localStorage.getItem('githubPat') || '';
  const repo = document.getElementById('githubRepoInput')?.value.trim() || localStorage.getItem('githubRepo') || '';
  const hiclassId = document.getElementById('hiclassIdInput')?.value.trim() || '';
  const hiclassPw = document.getElementById('hiclassPwInput')?.value.trim() || '';
  const kidsnoteId = document.getElementById('kidsnoteIdInput')?.value.trim() || '';
  const kidsnotePw = document.getElementById('kidsnotePwInput')?.value.trim() || '';
  const geminiKey = document.getElementById('geminiInput')?.value.trim() || localStorage.getItem('geminiKey') || '';

  if(!pat || !repo){ toast('⚠️ GitHub PAT와 repo(owner/repo)를 입력하세요'); return; }
  if(!repo.includes('/')){ toast('⚠️ repo 형식: owner/repo'); return; }

  toast('🔐 GitHub Secrets 저장중... (암호화중)');
  try{
    await sodium.ready;
    // Get public key
    const pubRes = await fetch(`https://api.github.com/repos/${repo}/actions/secrets/public-key`, {
      headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(!pubRes.ok){ const t=await pubRes.text(); throw new Error('Public key 실패: '+pubRes.status+' '+t); }
    const pubData = await pubRes.json();
    const publicKey = pubData.key;
    const keyId = pubData.key_id;

    async function encryptAndPut(name, value){
      if(!value) return;
      const binKey = sodium.from_base64(publicKey, sodium.base64_variants.ORIGINAL);
      const binSecret = sodium.from_string(value);
      const encryptedBytes = sodium.crypto_box_seal(binSecret, binKey);
      const encryptedBase64 = sodium.to_base64(encryptedBytes, sodium.base64_variants.ORIGINAL);
      const putRes = await fetch(`https://api.github.com/repos/${repo}/actions/secrets/${name}`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ encrypted_value: encryptedBase64, key_id: keyId })
      });
      if(!putRes.ok && putRes.status!==204){ const t=await putRes.text(); throw new Error(name+' 저장 실패: '+putRes.status+' '+t); }
      console.log(name+' saved');
    }

    // Save localStorage
    if(pat) localStorage.setItem('githubPat', pat);
    if(repo) localStorage.setItem('githubRepo', repo);
    if(hiclassId) localStorage.setItem('hiclassId', hiclassId);
    if(kidsnoteId) localStorage.setItem('kidsnoteId', kidsnoteId);
    // PW는 localStorage에 저장 안 함 (보안)

    await encryptAndPut('HICLASS_ID', hiclassId);
    await encryptAndPut('HICLASS_PW', hiclassPw);
    await encryptAndPut('KIDSNOTE_ID', kidsnoteId);
    await encryptAndPut('KIDSNOTE_PW', kidsnotePw);
    await encryptAndPut('GEMINI_API_KEY', geminiKey);

    // Firebase URL과 Service Account는 이미 있으면 유지, 없으면 안내
    const dbUrl = 'https://jeon-family-chat-default-rtdb.firebaseio.com';
    await encryptAndPut('FIREBASE_DATABASE_URL', dbUrl);
    // Service account는 PAT로 자동화 어려우니 수동 안내 - 일단 스킵

    toast('✅ GitHub Secrets 저장 완료! Actions에서 자동 사용됨');
    renderSettings();
  }catch(e){
    console.error(e);
    toast('❌ 실패: '+e.message);
  }
}

function toggleScheduleTime(time){
  if(noticeSchedule.includes(time)){
    noticeSchedule = noticeSchedule.filter(t=>t!==time);
  } else {
    noticeSchedule.push(time);
    noticeSchedule.sort();
  }
  localStorage.setItem('noticeSchedule', JSON.stringify(noticeSchedule));
  // Firebase에도 저장
  if(settingsRef){
    settingsRef.update({noticeSchedule: noticeSchedule, updated_at: new Date().toISOString(), updated_by: cur});
  }
  renderSettings();
  toast('⏰ 공지 수집 시간: ' + noticeSchedule.join(', '));
}

}

function updateReadStatus(force){
  if(!force && document.hidden) return;
  const viewChat = document.getElementById('view-chat');
  if(!force && (!viewChat || viewChat.style.display==='none')) return;
  if(data.messages.length===0) return;
  const now = Date.now();
  if(!force && now - lastReadUpdate < 800) return;
  lastReadUpdate = now;
  const sorted = data.messages.slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  const last = sorted[sorted.length-1];
  if(!last) return;
  try{
    readsRef.child(cur).set({
      lastReadAt: new Date().toISOString(),
      lastReadId: last._key || last.id,
      updated_at: new Date().toISOString()
    });
  }catch(e){ console.log('read update error', e); }
}


function updateReadIconsOnly(){
  // 전체를 다시 그리지 않고 읽음 아이콘만 갱신 - 깜빡임 방지
  const sorted=data.messages.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const rows = document.querySelectorAll('#chatList .kakao-row');
  sorted.forEach((msg, idx)=>{
    const row = rows[idx];
    if(!row) return;
    const isMine = msg.author===cur;
    if(!isMine) return; // 내 메시지에만 아이콘
    const d = new Date(msg.created_at);
    const readers = [];
    for(const m of modes){
      if(m.id===msg.author) continue;
      if(m.id===cur) continue;
      const r = data.reads[m.id];
      let hasRead = false;
      if(r && r.lastReadAt && new Date(r.lastReadAt) >= d) hasRead = true;
      if(!hasRead){
        const sentAfter = data.messages.some(mm => mm.author===m.id && new Date(mm.created_at) > d);
        if(sentAfter) hasRead = true;
      }
      if(!hasRead && r && r.lastReadId){
        const lastReadMsg = data.messages.find(mm => mm._key===r.lastReadId || mm.id===r.lastReadId);
        if(lastReadMsg && new Date(lastReadMsg.created_at) >= d) hasRead = true;
      }
      if(hasRead) readers.push(m);
    }
    const iconsContainer = row.querySelector('.kakao-read-icons');
    if(iconsContainer){
      iconsContainer.innerHTML = readers.map(r=>'<span class="read-icon" title="'+r.id+' 읽음">'+r.icon+'</span>').join('');
    }
  });
}

let _lastChatKeys = '';
let _renderChatDebounce = null;
function renderChat(force){
  const el=document.getElementById('chatList');
  if(!el) return;
  const sorted=data.messages.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const currentKeys = sorted.map(m=>m._key||m.id).join(',');
  // 메시지 목록이 같고 force가 아니면, 읽음 아이콘만 업데이트 (깜빡임 방지)
  if(!force && currentKeys === _lastChatKeys && el.children.length>0){
    updateReadIconsOnly();
    return;
  }
  _lastChatKeys = currentKeys;
  let html='';
  let lastDate='';
  sorted.forEach(msg=>{
    const d=new Date(msg.created_at);
    const dateStr=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    if(dateStr!==lastDate){
      html+='<div class="date-sep">'+dateStr+'</div>';
      lastDate=dateStr;
    }
    const isMine=msg.author===cur;
    const mode=modes.find(m=>m.id===msg.author) || {icon:'👤'};
    const timeStr=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    const safeKey=(msg._key||'').replace(/'/g,"\'");
    const escContent=escapeHtml(msg.content || '');

    const readers = [];
    // 핵심 수정: 내 메시지(isMine)에만 읽음 표시, 그리고 나 자신(cur)은 제외
    if(isMine){
      for(const m of modes){
        if(m.id===msg.author) continue; // 글쓴이 자신 제외
        if(m.id===cur) continue; // 내 자신 제외 - 이미 내가 쓴 글이라 의미 없음, 상대만 보여야 함
        const r = data.reads[m.id];
        let hasRead = false;
        if(r && r.lastReadAt && new Date(r.lastReadAt) >= d){
          hasRead = true;
        }
        // 보완: 이 메시지 이후에 m이 메시지를 보냈다면 100% 읽은 것
        if(!hasRead){
          const sentAfter = data.messages.some(mm => mm.author===m.id && new Date(mm.created_at) > d);
          if(sentAfter) hasRead = true;
        }
        if(!hasRead && r && r.lastReadId){
          const lastReadMsg = data.messages.find(mm => mm._key===r.lastReadId || mm.id===r.lastReadId);
          if(lastReadMsg && new Date(lastReadMsg.created_at) >= d){
            hasRead = true;
          }
        }
        if(hasRead) readers.push(m);
      }
    }
    // isMine일 때만 아이콘 표시, 남의 글에는 표시 안 함 (카톡 그룹채팅 방식)
    const readIconsHtml = (isMine && readers.length>0) ? '<div class="kakao-read-icons">'+readers.map(r=>'<span class="read-icon" title="'+r.id+' 읽음">'+r.icon+'</span>').join('')+'</div>' : '';

    let quoteHtml = '';
    if(msg.replyTo){
      const parent = data.messages.find(m=> m._key===msg.replyTo || m.id===msg.replyTo);
      const parentAuthor = msg.replyAuthor || parent?.author || '알 수 없음';
      const parentContent = msg.replyContent || parent?.content || (parent?.type==='image' ? '📷 사진' : '');
      const safeParentContent = escapeHtml(parentContent).substring(0,50);
      quoteHtml = '<div class="kakao-quote">↩️ '+parentAuthor+': '+safeParentContent+'</div>';
    }

    let bubbleInner = '';
    if(msg.type==='image' && msg.imageUrl){
      const safeUrl = msg.imageUrl.replace(/'/g, "\'");
      const captionHtml = msg.content ? '<div class="img-caption">'+escContent+'</div>' : '';
      bubbleInner = '<div class="kakao-bubble has-image"><div>'+quoteHtml+'</div><div onclick="openImageViewer(\''+safeUrl+'\')"><img src="'+msg.imageUrl+'" loading="lazy" alt="사진">'+captionHtml+'</div></div>';
    } else {
      bubbleInner = '<div class="kakao-bubble"><div>'+quoteHtml+'</div><div onclick="setReply(\''+safeKey+'\')">'+ (escContent || '(사진)') +'</div></div>';
    }

    if(isMine){
      html+='<div class="kakao-row mine"><div class="kakao-content"><div class="kakao-bubble-line"><div class="kakao-read-wrap"><div class="kakao-meta"><span class="kakao-time">'+timeStr+'</span><div style="display:flex;gap:3px;"><button class="kakao-reply" onclick="setReply(\''+safeKey+'\')">↩️</button><button class="kakao-del" onclick="deleteMsg(\''+safeKey+'\')">삭제</button></div></div>'+readIconsHtml+'</div>'+bubbleInner+'</div></div></div>';
    } else {
      html+='<div class="kakao-row other"><div class="kakao-profile">'+mode.icon+'</div><div class="kakao-content"><div class="kakao-author">'+msg.author+'</div><div class="kakao-bubble-line">'+bubbleInner+'<div class="kakao-read-wrap"><div class="kakao-meta"><span class="kakao-time">'+timeStr+'</span><div style="display:flex;gap:3px;"><button class="kakao-reply" onclick="setReply(\''+safeKey+'\')">↩️</button><button class="kakao-del" onclick="deleteMsg(\''+safeKey+'\')">삭제</button></div></div>'+readIconsHtml+'</div></div></div></div>';
    }
  });
  el.innerHTML=html;
  requestAnimationFrame(()=>{
    el.scrollTop = el.scrollHeight;
    setTimeout(()=>{ el.scrollTop = el.scrollHeight; updateReadStatus(); }, 80);
  });
}

function renderTodos(){
  renderTodoSubTabs();
  const el=document.getElementById('todoList');
  const inputRow = document.getElementById('todoInputRow');
  const today = getTodayStr();

  if(todoSubTab==='routine'){
    if(cur==='해준' || cur==='해온'){
      el.innerHTML = '<div class="card" style="background:#FFF3CD;border:2px solid #FFC107;"><h3>🔒 부모 전용</h3><p>루틴 설정은 아빠/엄마만 할 수 있어요.</p></div>';
      if(inputRow) inputRow.style.display='none';
      return;
    }
    if(inputRow) inputRow.style.display='flex';
    document.getElementById('todoInput').placeholder='새 루틴 (예: 이불개기)';
    let list = data.routines.slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
    if(list.length===0){
      el.innerHTML = '<div class="card"><h3>루틴이 없어요</h3><p>매일 반복할 일을 추가해보세요. 매일 자정에 자동 생성됩니다.</p></div>';
    } else {
      el.innerHTML = list.map(r=>{
        const safeKey = (r._key||'').replace(/'/g,"\'");
        const isActive = r.active!==false;
        return '<div class="routine-card '+(isActive?'':'inactive')+'"><span class="routine-badge daily">매일</span><span class="rc-title" onclick="editRoutine(\''+safeKey+'\')">'+escapeHtml(r.title)+' <span style="font-size:9px;color:#666;">('+r.owner+') '+(isActive?'✅':'⏸️')+'</span></span><button onclick="toggleRoutineActive(\''+safeKey+'\')" style="border:1.5px solid black;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:900;background:'+(isActive?'#4ADE80':'#E5E7EB')+';cursor:pointer;">'+(isActive?'ON':'OFF')+'</button><button onclick="deleteRoutine(\''+safeKey+'\')" style="background:#FF4444;color:white;border:none;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;cursor:pointer;">삭제</button></div>';
      }).join('');
    }
    return;
  }

  if(inputRow){
    inputRow.style.display='flex';
    document.getElementById('todoInput').placeholder = todoSubTab==='today' ? '오늘 할일 추가' : '할일 추가';
  }

  let list = (cur==='해준' || cur==='해온') ? data.todos.filter(t=>t.owner===cur) : data.todos.slice();
  if(todoSubTab==='today'){
    list = list.filter(t=>{
      if(t.isRoutine) return t.dueDate===today;
      return true;
    });
  }
  list = list.sort((a,b)=>{
    if(a.isRoutine && !b.isRoutine) return -1;
    if(!a.isRoutine && b.isRoutine) return 1;
    return new Date(a.created_at)-new Date(b.created_at);
  });

  if(list.length===0){
    el.innerHTML = '<div class="card"><h3>할일이 없어요 🎉</h3><p>'+(todoSubTab==='today'?'오늘 루틴이 아직 생성 안 됐거나 다 했어요!':'새 할일을 추가해보세요')+'</p></div>';
    return;
  }

  el.innerHTML=list.map(t=>{
    const big=(cur==='해준' || cur==='해온');
    const safeKey = (t._key||'').replace(/'/g,"\'");
    const routineLabel = t.isRoutine ? '<span class="routine-badge daily">매일</span>' : (t.source==='ai-notice' ? '<span class="notice-badge ai">🤖 AI</span>' : '');
    const dueLabel = t.dueDate ? '<span style="font-size:8px;color:#666;">'+t.dueDate+'</span>' : '';
    return '<div class="todo"><button style="width:'+(big?'56px':'22px')+';height:'+(big?'56px':'22px')+';border-radius:50%;border:2px solid black;background:'+(t.done?'#4ADE80':'white')+';font-size:'+(big?'22px':'12px')+';cursor:pointer;" onclick="toggleTodo(\''+safeKey+'\')">'+(t.done?'✅':'⭕')+'</button><span onclick="editTodo(\''+safeKey+'\')" style="'+(t.done?'text-decoration:line-through;opacity:0.5':'')+'">'+routineLabel+escapeHtml(t.title)+' ('+t.owner+') '+dueLabel+'</span><button onclick="deleteTodo(\''+safeKey+'\')" style="background:#FF4444;color:white;border:none;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;">삭제</button></div>';
  }).join('');
}

function renderNotices(){
  renderNoticeSubTabs();
  const el = document.getElementById('noticeList');
  let list = data.notices.slice().sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
  if(noticeSubTab!=='all'){
    list = list.filter(n=> n.child===noticeSubTab);
  }
  if(list.length===0){
    el.innerHTML = '<div class="card"><h3>공지사항이 없어요</h3><p>GitHub Actions가 14:00/17:00/19:00에 자동 수집해요.<br>수동으로 추가하려면 아래 입력창을 이용하세요.<br><span style="font-size:9px;color:#666;">하이클래스=엄마, 키즈노트=아빠도 등록 가능</span></p></div>';
    return;
  }
  el.innerHTML = list.map(n=>{
    const safeKey = (n._key||'').replace(/'/g,"\'");
    const isNew = (Date.now() - new Date(n.created_at).getTime()) < 24*60*60*1000;
    const sourceBadge = n.source==='hiclass' ? '<span class="notice-badge hiclass">하이클래스</span>' : '<span class="notice-badge kidsnote">키즈노트</span>';
    const newBadge = isNew ? '<span class="notice-badge new">NEW</span>' : '';
    const aiBadge = n.aiTodos && n.aiTodos.length>0 ? '<span class="notice-badge ai">🤖 할일 '+n.aiTodos.length+'</span>' : '';
    const aiListHtml = n.aiTodos && n.aiTodos.length>0 ? '<div style="margin-top:8px;">'+n.aiTodos.map((t,i)=> '<div class="ai-todo-item"><input type="checkbox" disabled><span>'+escapeHtml(t.title)+' ('+t.owner+') '+(t.due||'')+'</span></div>').join('')+'<div class="notice-actions"><button class="btn-add-todo" onclick="addAiTodosToTodoList(\''+safeKey+'\')">✅ 할일로 등록</button></div></div>' : '<div class="notice-actions"><button class="btn-ai" onclick="handleAiExtract(\''+safeKey+'\')">🤖 AI로 할일 추출 (제미나이)</button></div>';
    return `<div class="notice-card ${isNew?'new':''}">
      <div class="nc-head"><span class="notice-badge" style="background:${n.child==='해준'?'#E3F2FD':'#FFF3E0'}">${n.child}</span>${sourceBadge}${newBadge}${aiBadge}<span style="flex:1"></span><button onclick="deleteNotice('${safeKey}')" style="background:#FF4444;color:white;border:none;border-radius:7px;padding:3px 6px;font-size:8px;font-weight:900;">삭제</button></div>
      <div class="nc-title" onclick="editNotice('${safeKey}')">${escapeHtml(n.title)}</div>
      <div class="notice-meta">${new Date(n.created_at).toLocaleString('ko-KR')} | 등록: ${n.registeredBy||'자동'} ${n.link?` | <a href="${n.link}" target="_blank" style="font-size:9px;">원문보기</a>`:''}</div>

function addNoticeManual(){
  const inp = document.getElementById('noticeInput');
  const title = inp.value.trim();
  if(!title) return;
  const content = prompt('공지 내용 붙여넣기:');
  if(content===null) return;
  const child = cur==='해온' ? '해온' : (cur==='해준' ? '해준' : prompt('대상: 해준 or 해온','해준')||'해준');
  const source = child==='해준' ? 'hiclass' : 'kidsnote';
  const notice = {
    id: Date.now().toString(),
    child: child,
    source: source,
    title: title,
    content: content,
    link: '',
    registeredBy: cur,
    created_at: new Date().toISOString()
  };
  noticesRef.push(notice);
  inp.value='';

function changeMode(id){
  cur=id;
  localStorage.setItem('curUser', id);
  renderTop();
  renderChat();
  renderTodos();
  renderNotices();
  renderSettings();
  toast(modes.find(m=>m.id===id).icon+' '+id+' 모드로 변경');
  setTimeout(()=>updateReadStatus(), 300);
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; }, 2500);
}


function setReply(key){
  const msg = data.messages.find(m=>m._key===key);
  if(!msg) return;
  replyTarget = msg;
  const preview = document.getElementById('replyPreview');
  const author = msg.author;
  const content = msg.type==='image' ? '📷 사진' : (msg.content||'').substring(0,40);
  preview.innerHTML = '<div class="reply-preview-content"><strong>'+author+'에게 답장</strong><span>'+escapeHtml(content)+'</span></div><button class="reply-preview-close" onclick="clearReply()">×</button>';
  preview.style.display = 'flex';
  document.getElementById('chatInput').focus();
  toast('↩️ '+author+'에게 답장');
}

function clearReply(){
  replyTarget = null;
  const preview = document.getElementById('replyPreview');
  if(preview){ preview.style.display='none'; preview.innerHTML=''; }
}

function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim(); if(!txt) return;
  const msg={id:Date.now().toString(),author:cur,content:txt,type:'text',source:'family',created_at:new Date().toISOString()};
  if(replyTarget){
    msg.replyTo = replyTarget._key || replyTarget.id;
    msg.replyAuthor = replyTarget.author;
    msg.replyContent = replyTarget.type==='image' ? '📷 사진' : (replyTarget.content||'').substring(0,100);
  }
  chatRef.push(msg);
  inp.value='';
  clearReply();
  sendPushToFamily(cur, txt);
  setTimeout(()=>{ updateReadStatus(true); }, 300);
}

function deleteMsg(key){ if(!confirm('삭제?')) return; 
  const msg = data.messages.find(m=>m._key===key);
  if(msg && msg.storagePath){
    storageRef.child(msg.storagePath).delete().catch(()=>{});
  }
  db.ref('family/'+familyId+'/messages/'+key).remove(); 
}
function editMsg(key){ 
  const msg=data.messages.find(m=>m._key===key); if(!msg) return;
  if(msg.type==='image'){ const nt=prompt('캡션 수정:', msg.content||''); if(nt===null) return; db.ref('family/'+familyId+'/messages/'+key).update({content:nt.trim()}); return; }
  const nt=prompt('수정:', msg.content); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/messages/'+key).update({content:nt.trim()});
}

function addTodo(){
  const inp=document.getElementById('todoInput');
  const title=inp.value.trim(); if(!title) return;
  const todo={id:Date.now().toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()};
  todosRef.push(todo);
  inp.value='';
}
function toggleTodo(key){
  const t=data.todos.find(x=>x._key===key);
  if(t) db.ref('family/'+familyId+'/todos/'+key).update({done:!t.done});
}
function editTodo(key){
  const t=data.todos.find(x=>x._key===key); if(!t) return;
  const nt=prompt('수정:', t.title); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/todos/'+key).update({title:nt.trim()});
}
function deleteTodo(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/todos/'+key).remove(); }

function addRoutine(){
  if(cur==='해준' || cur==='해온'){ toast('🔒 부모만 루틴 추가 가능'); return; }
  const inp=document.getElementById('todoInput');
  const title=inp.value.trim(); if(!title) return;
  const routine={id:Date.now().toString(),owner:'해준',title:title,cycle:'daily',active:true,created_at:new Date().toISOString()};
  routinesRef.push(routine);
  inp.value='';
  toast('🔁 루틴 추가됨: '+title);
}
function toggleRoutineActive(key){
  if(cur==='해준' || cur==='해온'){ toast('🔒 부모만'); return; }
  const r=data.routines.find(x=>x._key===key);
  if(r) db.ref('family/'+familyId+'/routines/'+key).update({active:!r.active});
}
function editRoutine(key){
  if(cur==='해준' || cur==='해온'){ toast('🔒 부모만'); return; }
  const r=data.routines.find(x=>x._key===key); if(!r) return;
  const nt=prompt('루틴 수정:', r.title); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/routines/'+key).update({title:nt.trim()});
}
function deleteRoutine(key){ if(cur==='해준' || cur==='해온'){ toast('🔒 부모만'); return; } if(!confirm('루틴 삭제?')) return; db.ref('family/'+familyId+'/routines/'+key).remove(); }

function addSample(){
  ['이불 개기','양치 3분','가방 싸기'].forEach((title,i)=>{
    if(!data.todos.some(t=>t.title===title)){
      todosRef.push({id:(Date.now()+i).toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()});
    }
  });
}
function clearAll(){ if(!confirm('전체 삭제?')) return; chatRef.remove(); todosRef.remove(); noticesRef.remove(); }

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  storageRef = firebase.storage().ref();
  if(!localStorage.getItem('familyId')){ localStorage.setItem('familyId', 'jeon-family'); }
  familyId = localStorage.getItem('familyId') || 'jeon-family';
  chatRef = db.ref('family/' + familyId + '/messages');
  todosRef = db.ref('family/' + familyId + '/todos');
  routinesRef = db.ref('family/' + familyId + '/routines');
  readsRef = db.ref('family/' + familyId + '/reads');
  noticesRef = db.ref('family/' + familyId + '/notices');
  settingsRef = db.ref('family/' + familyId + '/settings');
  setTimeout(migrateOldData, 1500);
} catch(e){ console.error(e); }

function renderTopWrapper(){ renderTop(); }
renderTopWrapper(); goTab('chat');
lastMsgCount = parseInt(localStorage.getItem('lastMsgCount')||'0');

chatRef.on('value', snap=>{
  const val=snap.val()||{};
  const msgs=Object.entries(val).map(([k,v])=>({_key:k, ...v})).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const last = msgs[msgs.length-1];
  const isNew = msgs.length > lastMsgCount && lastMsgCount !== 0;
  const isFirstLoad = lastMsgCount===0;
  data.messages=msgs;
  // 깜빡임 방지: 첫 로드나 새 메시지만 전체 렌더, 그 외는 디바운스
  if(_renderChatDebounce) clearTimeout(_renderChatDebounce);
  _renderChatDebounce = setTimeout(()=>{
    renderChat(isFirstLoad || isNew);
  }, isFirstLoad ? 0 : 80);
  if(isNew && last && last.author!==cur){
    toast('📩 ' + last.author + ': ' + (last.content||'📷 사진').substring(0,20));
    triggerAlarm(last.author, last.content||'사진');
  }
  lastMsgCount = msgs.length;
  localStorage.setItem('lastMsgCount', msgs.length);
  const dot = document.getElementById('dot');
  const liveText = document.getElementById('liveText');
  if(dot) dot.className='dot';
  if(liveText) liveText.textContent='🔥 실시간 연결됨 - 메시지 '+msgs.length+'개';
  if(!window._cleanupDone){
    window._cleanupDone=true;
    setTimeout(()=>{ cleanupOldData(); generateDailyRoutines(); }, 3000);
  } else {
    generateDailyRoutines();
  }
});

todosRef.on('value', snap=>{
  const val=snap.val()||{};
  data.todos=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderTodos();
  generateDailyRoutines();
});

routinesRef.on('value', snap=>{
  const val=snap.val()||{};
  data.routines=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderTodos();
  renderSettings();
  generateDailyRoutines();
});

readsRef.on('value', snap=>{
  const val=snap.val()||{};
  data.reads=val||{};
  // 읽음만 바뀌었을 때는 전체 렌더 대신 아이콘만 업데이트 - 깜빡임 방지
  updateReadIconsOnly();
});

settingsRef.on('value', snap=>{
  const val=snap.val()||{};
  data.settings=val||{};
  if(val.noticeSchedule && Array.isArray(val.noticeSchedule) && val.noticeSchedule.length>0){
    noticeSchedule = val.noticeSchedule;
    localStorage.setItem('noticeSchedule', JSON.stringify(noticeSchedule));
    // 설정 화면이 열려있으면 다시 렌더링
    if(document.getElementById('view-set') && document.getElementById('view-set').style.display!=='none'){
      try{ renderSettings(); }catch(e){}
    }
  }
});

noticesRef.on('value', snap=>{
  const val=snap.val()||{};
  data.notices=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderNotices();
  renderSettings();
});

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) updateReadStatus(); });
document.getElementById('chatList').addEventListener('scroll', ()=>{
  const el = document.getElementById('chatList');
  if(el.scrollTop + el.clientHeight >= el.scrollHeight - 30){ updateReadStatus(); }
});
