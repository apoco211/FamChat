.kakao-row.mine .kakao-meta{align-items:flex-end;}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
    setTimeout(()=>{
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.frequency.value = 1046;
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.4);
    }, 200);
  }catch(e){ console.log('audio error', e); }
}


// 기존 localStorage 데이터 마이그레이션 (Firebase 이전 버전용)
function migrateOldData(){
  const possibleKeys = ['familyChat', 'chatMessages', 'messages', 'family_data', 'jeon_family_chat'];
  let migrated = 0;
  possibleKeys.forEach(key=>{
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return;
      const parsed = JSON.parse(raw);
      let msgs = [];
      if(Array.isArray(parsed)) msgs = parsed;
      else if(parsed.messages && Array.isArray(parsed.messages)) msgs = parsed.messages;
      else if(parsed.data && parsed.data.messages) msgs = parsed.data.messages;
      
      if(msgs.length > 0){
        msgs.forEach(m=>{
          // 이미 Firebase에 있는지 체크 없이 일단 올림 - 중복 방지는 timestamp로
          if(m.content && m.author){
            chatRef.push({
              id: m.id || Date.now().toString() + Math.random(),
              author: m.author,
              content: m.content,
              source: m.source || 'migrated',
              created_at: m.created_at || new Date().toISOString()
            });
            migrated++;
          }
        });
      }
    }catch(e){}
  });
  if(migrated > 0){
    toast('📦 기존 데이터 '+migrated+'개 복구중...');
    setTimeout(()=>{ localStorage.removeItem('familyChat'); localStorage.removeItem('chatMessages'); }, 2000);
  }
  return migrated;
}

function triggerAlarm(author, content){
  if(!alarmEnabled) return;
  // iPhone처럼 2번 울림 + 진동
  playBeep();
  if(navigator.vibrate){
    navigator.vibrate([120,60,120,60,200]);
  }
  // iOS에서도 최대한 알림 띄우기 (PWA일 때)
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      // document.hidden 체크 완화 - iOS에서는 hidden이어도 띄워야 함
      const n = new Notification('📩 ' + author, {
        body: content,
        icon: 'https://cdn-icons-png.flaticon.com/512/5962/5962463.png',
        badge: 'https://cdn-icons-png.flaticon.com/512/5962/5962463.png',
        vibrate: [120,60,120],
        requireInteraction: false,
        silent: false
      });
      // 5초 후 자동 닫기
      setTimeout(()=>{ try{n.close();}catch(e){} }, 5000);
      // 클릭 시 창 포커스
      n.onclick = function(){ window.focus(); n.close(); };
    }catch(e){ console.log('notif error', e); }
  }
}

function requestNotifPermission(){
  if('Notification' in window){
    if(Notification.permission === 'default'){
      Notification.requestPermission().then(()=>{ initFCM(); });
    } else if(Notification.permission === 'granted'){
      initFCM();
    }
  }
}

}



// ===== v1.3.16 FCM Push System - iPhone/iPad 대응 =====
let messaging = null;
let fcmToken = localStorage.getItem('fcmToken') || null;
let fcmEnabled = false;
let deviceInfo = {};

// 디바이스 감지 (아내/아빠 아이폰, 해준 아이패드 반영)
function detectDevice(){
  const ua = navigator.userAgent;
  const isIPhone = /iPhone/i.test(ua);
  const isIPad = /iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isIOS = isIPhone || isIPad || /iPod/i.test(ua);
  deviceInfo = {
    userAgent: ua,
    isIPhone,
    isIPad,
    isIOS,
    isPWA: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone,
    platform: isIPad ? 'iPad' : (isIPhone ? 'iPhone' : 'Other'),
    curUser: cur,
    timestamp: new Date().toISOString()
  };
  return deviceInfo;
}

// FCM 초기화
async function initFCM(){
  try{
    detectDevice();
    if(!firebase.messaging.isSupported()){
      console.log('FCM not supported on this browser');
      updateFCMStatus('unsupported');
      return;
    }
    messaging = firebase.messaging();
    
    // Service Worker 등록 (GitHub Pages에서는 root에 있어야 함)
    if('serviceWorker' in navigator){
      try{
        const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
        console.log('SW registered', reg);
        // Use this SW for messaging
        // messaging.useServiceWorker(reg) - compat에서는 자동
      }catch(e){
        console.log('SW register fail', e);
      }
    }

    // VAPID 키 - Firebase Console > Project Settings > Cloud Messaging에서 생성 필요
    // TODO: 아래 키를 실제 VAPID로 교체하세요. 현재는 placeholder로 동작 안 할 수 있음
    const vapidKey = localStorage.getItem('vapidKey') || 'BNcX...YOUR_VAPID_KEY_HERE...';

    // 권한 요청
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      updateFCMStatus('denied');
      return;
    }

    // 토큰 가져오기 - VAPID가 없으면 에러 날 수 있어 try
    try{
      const token = await messaging.getToken({vapidKey: vapidKey.length > 20 ? vapidKey : undefined});
      if(token){
        fcmToken = token;
        localStorage.setItem('fcmToken', token);
        fcmEnabled = true;
        saveFCMToken(token);
        updateFCMStatus('granted');
        console.log('FCM Token:', token);
      }
    }catch(e){
      console.log('getToken error (VAPID 필요)', e);
      // VAPID 없이도 foreground 알림은 가능하도록 status 유지
      updateFCMStatus('no-vapid');
    }

    // Foreground 메시지 수신 (다른 앱 사용 중이 아니고 FamChat 보고 있을 때)
    messaging.onMessage((payload)=>{
      console.log('Foreground FCM', payload);
      const title = payload.notification?.title || payload.data?.author || 'FamChat';
      const body = payload.notification?.body || payload.data?.content || '새 메시지';
      // 아이폰처럼 소리+진동+토스트
      triggerAlarm(title, body);
      toast('📩 ' + title + ': ' + body.substring(0,20));
      // PWA라면 OS 알림도 띄우기
      if(Notification.permission === 'granted'){
        try{
          new Notification(title, {body: body, icon: 'https://cdn-icons-png.flaticon.com/512/5962/5962463.png'});
        }catch(e){}
      }
    });

  }catch(err){
    console.error('FCM init error', err);
    updateFCMStatus('error');
  }
}

function saveFCMToken(token){
  try{
    detectDevice();
    const tokenRef = db.ref('family/'+familyId+'/fcmTokens/'+cur);
    tokenRef.set({
      token: token,
      user: cur,
      device: deviceInfo.platform,
      isIOS: deviceInfo.isIOS,
      isIPad: deviceInfo.isIPad,
      isIPhone: deviceInfo.isIPhone,
      isPWA: deviceInfo.isPWA,
      ua: deviceInfo.userAgent.substring(0,120),
      updated_at: new Date().toISOString()
    });
    // 해준이 iPad용 별도 키도 저장 (멀티 디바이스 대응)
    const allRef = db.ref('family/'+familyId+'/fcmTokens_all').push();
    allRef.set({
      token: token,
      user: cur,
      device: deviceInfo.platform,
      updated_at: new Date().toISOString()
    });
  }catch(e){ console.log('save token error', e); }
}

function updateFCMStatus(status){
  // 설정 화면 갱신용
  window._fcmStatus = status;
  if(document.getElementById('setWrap')){
    // renderSettings가 있으면 다시 그리게
    try{ renderSettings(); }catch(e){}
  }
}

// FCM으로 다른 가족에게 푸시 보내기 (클라이언트 팬아웃 - 가족용 간이 버전)
// 진짜 백그라운드 푸시(앱 꺼졌을 때도)는 Cloud Functions가 필요하지만,
// 이 함수는 앱이 백그라운드에 있을 때라도 FCM 토큰으로 직접 푸시 시도
async function sendPushToFamily(author, content){
  try{
    const snap = await db.ref('family/'+familyId+'/fcmTokens').once('value');
    const tokens = snap.val() || {};
    // 자신 제외
    const otherTokens = Object.entries(tokens).filter(([user, data])=> user !== author).map(([_, d])=> d.token).filter(Boolean);
    if(otherTokens.length === 0) return;

    // 여기서는 서버 키가 없으므로 실제로는 Cloud Function이 필요.
    // 대신 Realtime DB에 pushQueue를 만들어 Cloud Function 트리거용으로 저장
    const queueRef = db.ref('family/'+familyId+'/pushQueue').push();
    await queueRef.set({
      author: author,
      content: content,
      targetTokens: otherTokens,
      created_at: new Date().toISOString(),
      // Cloud Function이 이 큐를 보고 FCM 발송
    });
    console.log('Push queue added for', otherTokens.length, 'devices');
  }catch(e){ console.log('sendPush error', e); }
}

function renderChat(){
  const el=document.getElementById('chatList');
  const sorted=data.messages.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let html='';
  let lastDate='';
  sorted.forEach(msg=>{
    const d=new Date(msg.created_at);
    const dateStr=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    if(dateStr!==lastDate){
      html+=`<div class="date-sep">${dateStr}</div>`;
      lastDate=dateStr;
    }
    const isMine=msg.author===cur;
    const mode=modes.find(m=>m.id===msg.author) || {icon:'👤'};
    const timeStr=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    const safeKey=(msg._key||'').replace(/'/g,"\'");
    const escContent=escapeHtml(msg.content);
    if(isMine){
      html+=`<div class="kakao-row mine">
        <div class="kakao-content">
          <div class="kakao-bubble-line">
            <div class="kakao-meta"><span class="kakao-time">${timeStr}</span><button class="kakao-del" onclick="deleteMsg('${safeKey}')">삭제</button></div>
            <div class="kakao-bubble" onclick="editMsg('${safeKey}')">${escContent}</div>
          </div>
        </div>
      </div>`;
    } else {
      html+=`<div class="kakao-row other">
        <div class="kakao-profile">${mode.icon}</div>
        <div class="kakao-content">
          <div class="kakao-author">${msg.author}</div>
          <div class="kakao-bubble-line">
            <div class="kakao-bubble" onclick="editMsg('${safeKey}')">${escContent}</div>
            <div class="kakao-meta"><span class="kakao-time">${timeStr}</span><button class="kakao-del" onclick="deleteMsg('${safeKey}')">삭제</button></div>
          </div>
        </div>
      </div>`;
    }
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim(); if(!txt) return;
  const msg={id:Date.now().toString(),author:cur,content:txt,source:'family',created_at:new Date().toISOString()};
  chatRef.push(msg);
  inp.value='';
}

function deleteMsg(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/messages/'+key).remove(); }
function editMsg(key){ 
  const msg=data.messages.find(m=>m._key===key); if(!msg) return;
  const nt=prompt('수정:', msg.content); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/messages/'+key).update({content:nt.trim()});
}
function addTodo(){
  const inp=document.getElementById('todoInput');
  const title=inp.value.trim(); if(!title) return;
  const todo={id:Date.now().toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()};
  todosRef.push(todo);
  inp.value='';
}
function toggleTodo(key){
  const t=data.todos.find(x=>x._key===key);
  if(t) db.ref('family/'+familyId+'/todos/'+key).update({done:!t.done});
}
function editTodo(key){
  const t=data.todos.find(x=>x._key===key); if(!t) return;

}

function addSample(){
  ['이불 개기','양치 3분','가방 싸기'].forEach((title,i)=>{
    if(!data.todos.some(t=>t.title===title)){
      todosRef.push({id:(Date.now()+i).toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()});
    }
  });
}
function clearAll(){ if(!confirm('전체 삭제?')) return; chatRef.remove(); todosRef.remove(); }

chatRef.on('value', snap=>{
  const val=snap.val()||{};
  const msgs=Object.entries(val).map(([k,v])=>({_key:k, ...v})).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const wasLonger = msgs.length > data.messages.length;
  const last = msgs[msgs.length-1];
  const isNew = msgs.length > lastMsgCount && lastMsgCount !== 0;
  data.messages=msgs;
  renderChat();
  if(isNew && last && last.author!==cur){
    toast('📩 ' + last.author + ': ' + last.content.substring(0,20));
    triggerAlarm(last.author, last.content);
  }
  lastMsgCount = msgs.length;
  localStorage.setItem('lastMsgCount', msgs.length);
  document.getElementById('dot').className='dot';
  document.getElementById('liveText').textContent='🔥 실시간 연결됨 - 메시지 '+msgs.length+'개';
});

todosRef.on('value', snap=>{
  const val=snap.val()||{};
  data.todos=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderTodos();
});
