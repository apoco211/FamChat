<html lang="ko"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전씨네 Family Chat</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#FFF8F0;color:#111827;padding:10px;}
h1{font-size:22px;font-weight:900;text-align:center;padding:10px 0 6px;}
.device{max-width:420px;margin:0 auto;background:white;border:5px solid black;border-radius:28px;padding:8px;}
.inner{border-radius:18px;padding:10px;min-height:640px;display:flex;flex-direction:column;background:#F9FAFB;}
.inner.kid{background:#FFF0F6;}
.top{background:black;color:white;border-radius:14px;padding:9px;text-align:center;font-size:11px;font-weight:900;margin-bottom:6px;cursor:pointer;}
.live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;background:#E8F5E9;border:1.5px solid black;border-radius:12px;padding:7px;margin-bottom:6px;}
.live.off{background:#FFEBEE;}
.dot{width:10px;height:10px;background:#4ADE80;border-radius:50%;animation:pulse 1s infinite;}
.dot.off{background:#FF4444;animation:none;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
.tabs{display:flex;gap:5px;margin-bottom:8px;}
.tab{flex:1;padding:9px;border-radius:18px;font-size:11px;font-weight:900;border:2px solid black;text-align:center;cursor:pointer;}
.tab.on{background:black;color:white;}
.tab.off{background:white;color:black;}
.box{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;max-height:360px;}
.msg{border:2px solid black;border-radius:14px;padding:9px;background:white;position:relative;animation:slideIn 0.2s;}
@keyframes slideIn{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.msg.mine{background:#E3F2FD;border-color:#1976D2;}
.author{font-size:10px;font-weight:900;background:black;color:white;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:4px;}
.author.mine{background:#1976D2;}
.text{font-size:13px;font-weight:700;padding-right:22px;word-break:break-word;white-space:pre-wrap;}
.time{font-size:9px;color:#666;margin-top:3px;}
.del{position:absolute;top:5px;right:5px;background:#FF4444;color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;}
.input-area{border:2px solid black;border-radius:14px;padding:7px;background:white;margin-top:6px;}
.row{display:flex;gap:5px;}
.row input{flex:1;border:1.5px solid black;border-radius:18px;padding:10px 12px;font-size:12px;font-weight:700;}
.row button{border:none;background:black;color:white;border-radius:18px;padding:10px 16px;font-weight:900;cursor:pointer;}
.todo{border:2px solid black;border-radius:14px;padding:9px;background:white;display:flex;gap:8px;align-items:center;}
.todo span{flex:1;font-size:12px;font-weight:700;cursor:pointer;word-break:break-word;}
.set-wrap{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:460px;}
.card{border:2px solid black;border-radius:14px;padding:11px;background:white;}
.card h3{font-size:12px;font-weight:900;margin-bottom:5px;}
.card p{font-size:10px;line-height:1.4;}
.modes{display:flex;gap:5px;margin-top:6px;}
.modes button{flex:1;padding:10px 3px;border-radius:16px;border:2px solid black;font-size:10px;font-weight:900;cursor:pointer;background:white;}
.modes button.on{background:black;color:white;}
.btn{width:100%;border:2px solid black;border-radius:16px;padding:10px;font-size:10px;font-weight:900;cursor:pointer;margin-top:5px;}
.btn.green{background:#4ADE80;color:black;}
.btn.white{background:white;color:black;}
.btn.black{background:black;color:white;}
.btn.yellow{background:#FFD93D;color:black;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:black;color:white;padding:10px 16px;border-radius:18px;font-size:11px;font-weight:900;display:none;z-index:99;border:2px solid white;}
.kid .todo{padding:16px;border-width:3px;border-radius:20px;}
.kid .todo span{font-size:18px;font-weight:900;}
.kid .todo button{width:56px;height:56px;font-size:24px;border-radius:50%;border:3px solid black;background:white;}
</style>
</head>
<body>
<h1>전씨네 Family Chat</h1>
<div class="device">
<div class="inner" id="inner">
<div class="top" id="topBadge" onclick="goTab('set')">연결중...</div>
<div class="live" id="liveStatus"><div class="dot off" id="dot"></div><span id="liveText">Firebase 연결중...</span></div>
<div class="tabs">
<div class="tab on" id="tab-chat" onclick="goTab('chat')">💬 채팅</div>
<div class="tab off" id="tab-todo" onclick="goTab('todo')">✅ 할일</div>
<div class="tab off" id="tab-set" onclick="goTab('set')">⚙️ 설정</div>
</div>

<div id="view-chat" class="box">
<div class="list" id="chatList"></div>
<div class="input-area">
<div style="font-size:9px;font-weight:900;background:black;color:white;display:inline-block;padding:2px 6px;border-radius:8px;margin-bottom:5px;" id="sendBadge">전송중</div>
<div class="row">
<input id="chatInput" placeholder="메시지..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">전송</button>
</div>
</div>
</div>

<div id="view-todo" class="box" style="display:none;">
<div class="list" id="todoList"></div>
<div class="row" style="margin-top:6px;">
<input id="todoInput" placeholder="할일 추가">
<button onclick="addTodo()">추가</button>
</div>
</div>

<div id="view-set" class="box" style="display:none;">
<div class="set-wrap" id="setWrap"></div>
</div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {'apiKey': 'AIzaSyDKTiB6lqRDCHaM8vxWwbiX0K_nlb8_4jQ', 'authDomain': 'jeon-family-chat.firebaseapp.com', 'projectId': 'jeon-family-chat', 'storageBucket': 'jeon-family-chat.firebasestorage.app', 'messagingSenderId': '575056885546', 'appId': '1:575056885546:web:2fa1c64876773817906413', 'measurementId': 'G-977DP06VSQ', 'databaseURL': 'https://jeon-family-chat-default-rtdb.firebaseio.com'};

let db, chatRef, todosRef;
let cur = localStorage.getItem('curUser') || '아빠';
const modes = [{id:'아빠',icon:'👨'},{id:'엄마',icon:'👩'},{id:'해준',icon:'👦'}];
let familyId = localStorage.getItem('familyId') || 'jeon-family';

let data = {messages:[], todos:[], settings:{}};

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  chatRef = db.ref('family/' + familyId + '/messages');
  todosRef = db.ref('family/' + familyId + '/todos');
} catch(e) {
  console.error('Firebase init error', e);
}

function goTab(name){
  document.getElementById('view-chat').style.display='none';
  document.getElementById('view-todo').style.display='none';
  document.getElementById('view-set').style.display='none';
  document.getElementById('tab-chat').className='tab off';
  document.getElementById('tab-todo').className='tab off';
  document.getElementById('tab-set').className='tab off';
  document.getElementById('view-'+name).style.display='flex';
  document.getElementById('tab-'+name).className='tab on';
  if(name==='set') renderSettings();
  if(name==='todo') renderTodos();
  if(name==='chat') renderChat();
}

function renderTop(){
  const m = modes.find(x=>x.id===cur);
  document.getElementById('topBadge').textContent = m.icon + ' ' + m.id + ' 모드 - 터치하면 설정';
  document.getElementById('sendBadge').textContent = m.icon + ' ' + m.id + '로 전송';
  document.getElementById('chatInput').placeholder = m.id + '로 메시지...';
  const inner=document.getElementById('inner');
  if(cur==='해준') inner.classList.add('kid'); else inner.classList.remove('kid');
}

function renderChat(){
  const el=document.getElementById('chatList');
  el.innerHTML=data.messages.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(msg=>{
    const isMine=msg.author===cur;
    const cls=isMine?'msg mine':'msg';
    const authorCls=isMine?'author mine':'author';
    return `<div class="${cls}"><button class="del" onclick="deleteMsg('${msg._key}')">×</button><div class="${authorCls}">${msg.author}${isMine?' (나)':''}</div><div class="text" onclick="editMsg('${msg._key}')">${escapeHtml(msg.content)}</div><div class="time">${new Date(msg.created_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
  }).join('');
}

function renderTodos(){
  const el=document.getElementById('todoList');
  let list = cur==='해준' ? data.todos.filter(t=>t.owner==='해준') : data.todos;
  el.innerHTML=list.map(t=>{
    const big=cur==='해준';
    return `<div class="todo"><button style="width:${big?'56px':'22px'};height:${big?'56px':'22px'};border-radius:50%;border:2px solid black;background:${t.done?'#4ADE80':'white'};font-size:${big?'22px':'12px'};cursor:pointer;" onclick="toggleTodo('${t._key}')">${t.done?'✅':'⭕'}</button><span onclick="editTodo('${t._key}')" style="${t.done?'text-decoration:line-through;opacity:0.5':''}">${escapeHtml(t.title)} (${t.owner})</span><button onclick="deleteTodo('${t._key}')" style="background:#FF4444;color:white;border:none;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;">삭제</button></div>`;
  }).join('');
}

function renderSettings(){
  const wrap=document.getElementById('setWrap');
  let html='';
  html+=`<div class="card" style="background:#E8F5E9;border:2px solid #4ADE80;"><h3>🔥 Firebase 연결됨</h3><p>✅ jeon-family-chat 프로젝트 연결 성공<br>Family ID: ${familyId}<br>메시지 ${data.messages.length}개 • 할일 ${data.todos.length}개<br>아내 폰에서도 이 파일 열면 0.3초 실시간</p><p style="margin-top:6px;font-size:9px;background:white;padding:5px;border-radius:8px;border:1px solid black;">프로젝트: jeon-family-chat<br>DB: ${firebaseConfig.databaseURL}</p></div>`;
  html+=`<div class="card" style="background:#FFF9E6;border:2px dashed black;"><h3>🔄 사용자 전환</h3><div class="modes">`;
  modes.forEach(m=>{
    const on=cur===m.id?'on':'';
    html+=`<button class="${on}" onclick="changeMode('${m.id}')">${m.icon} ${m.id}<br>${cur===m.id?'✓ 현재':''}</button>`;
  });
  html+=`</div></div>`;
  html+=`<div class="card"><h3>👨‍👩‍👧‍👦 Family ID</h3><p>같은 ID면 같은 대화방 (아내랑 같은 ID 써야 함)</p><input value="${familyId}" onchange="changeFamilyId(this.value)"><p style="font-size:9px;color:#666;">예: jeon-family</p></div>`;
  html+=`<div class="card"><h3>📝 관리</h3><button class="btn yellow" onclick="addSample()">샘플 할일</button><button class="btn white" onclick="clearAll()">전체 삭제</button></div>`;
  html+=`<div class="card" style="background:#FFF3E0;"><h3>⚠️ Realtime Database 만들기</h3><p>만약 메시지가 안 뜬다면:<br>1. Firebase 콘솔 > Realtime Database > 만들기<br>2. 위치: us-central1<br>3. 규칙: 테스트 모드<br>4. 규칙을 아래처럼 변경:<br><span style="font-family:monospace;font-size:9px;background:white;padding:4px;display:block;border-radius:6px;margin-top:4px;">{"rules":{".read":true,".write":true}}</span></p><button class="btn black" onclick="window.open('https://console.firebase.google.com/project/jeon-family-chat/database','_blank')">🔧 Firebase DB 열기</button></div>`;
  wrap.innerHTML=html;
}

function changeMode(id){ cur=id; localStorage.setItem('curUser', id); renderTop(); renderSettings(); renderTodos(); renderChat(); goTab(id==='해준'?'todo':'chat'); toast(id+' 모드로 변경'); }
function changeFamilyId(v){ familyId=v; localStorage.setItem('familyId', v); location.reload(); }
function escapeHtml(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',2500); }

function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim(); if(!txt) return;
  const msg={id:Date.now().toString(),author:cur,content:txt,source:'family',created_at:new Date().toISOString()};
  chatRef.push(msg);
  inp.value='';
}

function deleteMsg(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/messages/'+key).remove(); }
function editMsg(key){ 
  const msg=data.messages.find(m=>m._key===key); if(!msg) return;
  const nt=prompt('수정:', msg.content); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/messages/'+key).update({content:nt.trim()});
}
function addTodo(){
  const inp=document.getElementById('todoInput');
  const title=inp.value.trim(); if(!title) return;
  const todo={id:Date.now().toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()};
  todosRef.push(todo);
  inp.value='';
}
function toggleTodo(key){
  const t=data.todos.find(x=>x._key===key);
  if(t) db.ref('family/'+familyId+'/todos/'+key).update({done:!t.done});
}
function editTodo(key){
  const t=data.todos.find(x=>x._key===key); if(!t) return;
  const nt=prompt('수정:', t.title); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/todos/'+key).update({title:nt.trim()});
}
function deleteTodo(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/todos/'+key).remove(); }
function addSample(){
  ['이불 개기','양치 3분','가방 싸기'].forEach((title,i)=>{
    if(!data.todos.some(t=>t.title===title)){
      todosRef.push({id:(Date.now()+i).toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()});
    }
  });
}
function clearAll(){ if(!confirm('전체 삭제? 모든 기기에서 삭제됨')) return; chatRef.remove(); todosRef.remove(); }

// Firebase 리스너
chatRef.on('value', snap=>{
  const val=snap.val()||{};
  const msgs=Object.entries(val).map(([k,v])=>({_key:k, ...v})).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const wasLonger = msgs.length > data.messages.length;
  const last = msgs[msgs.length-1];
  data.messages=msgs;
  renderChat();
  if(wasLonger && last && last.author!==cur){
    toast('📩 ' + last.author + ': ' + last.content.substring(0,20));
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }
  document.getElementById('dot').className='dot';
  document.getElementById('liveText').textContent='🔥 실시간 연결됨 - 메시지 '+msgs.length+'개';
});

todosRef.on('value', snap=>{
  const val=snap.val()||{};
  data.todos=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderTodos();
});

chatRef.on('value', ()=>{ document.getElementById('dot').className='dot'; }, err=>{
  document.getElementById('dot').className='dot off';
  document.getElementById('liveText').textContent='❌ 연결 실패 - Database 규칙 확인 필요';
});

renderTop(); goTab('chat');
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>

</body></html>
