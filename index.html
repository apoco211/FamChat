<script>
const firebaseConfig = {'apiKey': 'AIzaSyDKTiB6lqRDCHaM8vxWwbiX0K_nlb8_4jQ', 'authDomain': 'jeon-family-chat.firebaseapp.com', 'projectId': 'jeon-family-chat', 'storageBucket': 'jeon-family-chat.firebasestorage.app', 'messagingSenderId': '575056885546', 'appId': '1:575056885546:web:2fa1c64876773817906413', 'databaseURL': 'https://jeon-family-chat-default-rtdb.firebaseio.com'};

let db, chatRef, todosRef;
let cur = localStorage.getItem('curUser') || '아빠';
const modes = [{id:'아빠',icon:'👨'},{id:'엄마',icon:'👩'},{id:'해준',icon:'👦'}];
let familyId = localStorage.getItem('familyId') || 'jeon-family';
let data = {messages:[], todos:[]};

let alarmEnabled = localStorage.getItem('alarmEnabled') !== 'false';
let lastMsgCount = 0;

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
    setTimeout(()=>{
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.frequency.value = 1046;
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.4);
    }, 200);
  }catch(e){ console.log('audio error', e); }
}


// 기존 localStorage 데이터 마이그레이션 (Firebase 이전 버전용)
function migrateOldData(){
  const possibleKeys = ['familyChat', 'chatMessages', 'messages', 'family_data', 'jeon_family_chat'];
  let migrated = 0;
  possibleKeys.forEach(key=>{
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return;
      const parsed = JSON.parse(raw);
      let msgs = [];
      if(Array.isArray(parsed)) msgs = parsed;
      else if(parsed.messages && Array.isArray(parsed.messages)) msgs = parsed.messages;
      else if(parsed.data && parsed.data.messages) msgs = parsed.data.messages;
      
      if(msgs.length > 0){
        msgs.forEach(m=>{
          // 이미 Firebase에 있는지 체크 없이 일단 올림 - 중복 방지는 timestamp로
          if(m.content && m.author){
            chatRef.push({
              id: m.id || Date.now().toString() + Math.random(),
              author: m.author,
              content: m.content,
              source: m.source || 'migrated',
              created_at: m.created_at || new Date().toISOString()
            });
            migrated++;
          }
        });
      }
    }catch(e){}
  });
  if(migrated > 0){
    toast('📦 기존 데이터 '+migrated+'개 복구중...');
    setTimeout(()=>{ localStorage.removeItem('familyChat'); localStorage.removeItem('chatMessages'); }, 2000);
  }
  return migrated;
}

function triggerAlarm(author, content){
  if(!alarmEnabled) return;
  playBeep();
  if(navigator.vibrate) navigator.vibrate([150,80,150]);
  // 브라우저 알림
  if('Notification' in window && Notification.permission === 'granted'){
    if(document.hidden){
      new Notification('📩 ' + author, {body: content, icon: 'https://cdn-icons-png.flaticon.com/512/5962/5962463.png'});
    }
  }
  // 토스트는 이미 있음
}

function requestNotifPermission(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

function toggleAlarm(){
  alarmEnabled = !alarmEnabled;
  localStorage.setItem('alarmEnabled', alarmEnabled);
  renderSettings();
  toast(alarmEnabled ? '🔔 알람 켜짐' : '🔕 알람 꺼짐');
}


try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  // familyId 고정 - 실수로 바뀌는 거 방지
  if(!localStorage.getItem('familyId')){ localStorage.setItem('familyId', 'jeon-family'); }
  familyId = localStorage.getItem('familyId') || 'jeon-family';
  chatRef = db.ref('family/' + familyId + '/messages');
  todosRef = db.ref('family/' + familyId + '/todos');
  setTimeout(migrateOldData, 1500);
} catch(e){ console.error(e); }

function goTab(name){
  document.getElementById('view-chat').style.display='none';
  document.getElementById('view-todo').style.display='none';
  document.getElementById('view-set').style.display='none';
  document.getElementById('tab-chat').className='tab off';
  document.getElementById('tab-todo').className='tab off';
  document.getElementById('tab-set').className='tab off';
  document.getElementById('view-'+name).style.display='flex';
  document.getElementById('tab-'+name).className='tab on';
  if(name==='set') renderSettings();
  if(name==='todo') renderTodos();
  if(name==='chat') renderChat();
}

function renderTop(){
  const m = modes.find(x=>x.id===cur);
  document.getElementById('topBadge').textContent = m.icon + ' ' + m.id + ' 모드 - 터치하면 설정';
  document.getElementById('sendBadge').textContent = m.icon + ' ' + m.id + '로 전송';
  document.getElementById('chatInput').placeholder = m.id + '로 메시지...';
  const inner=document.getElementById('inner');
  if(cur==='해준') inner.classList.add('kid'); else inner.classList.remove('kid');
}

function renderChat(){
  const el=document.getElementById('chatList');
  const sorted=data.messages.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let html='';
  let lastDate='';
  sorted.forEach(msg=>{
    const d=new Date(msg.created_at);
    const dateStr=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    if(dateStr!==lastDate){
      html+=`<div class="date-sep">${dateStr}</div>`;
      lastDate=dateStr;
    }
    const isMine=msg.author===cur;
    const mode=modes.find(m=>m.id===msg.author) || {icon:'👤'};
    const timeStr=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    const safeKey=(msg._key||'').replace(/'/g,"\'");
    const escContent=escapeHtml(msg.content);
    if(isMine){
      html+=`<div class="kakao-row mine">
        <div class="kakao-content">
          <div class="kakao-bubble-line">
            <div class="kakao-meta"><span class="kakao-time">${timeStr}</span><button class="kakao-del" onclick="deleteMsg('${safeKey}')">삭제</button></div>
            <div class="kakao-bubble" onclick="editMsg('${safeKey}')">${escContent}</div>
          </div>
        </div>
      </div>`;
    } else {
      html+=`<div class="kakao-row other">
        <div class="kakao-profile">${mode.icon}</div>
        <div class="kakao-content">
          <div class="kakao-author">${msg.author}</div>
          <div class="kakao-bubble-line">
            <div class="kakao-bubble" onclick="editMsg('${safeKey}')">${escContent}</div>
            <div class="kakao-meta"><span class="kakao-time">${timeStr}</span><button class="kakao-del" onclick="deleteMsg('${safeKey}')">삭제</button></div>
          </div>
        </div>
      </div>`;
    }
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

function renderTodos(){

  const el=document.getElementById('todoList');
  let list = cur==='해준' ? data.todos.filter(t=>t.owner==='해준') : data.todos;
  el.innerHTML=list.map(t=>{
    const big=cur==='해준';
    return `<div class="todo"><button style="width:${big?'56px':'22px'};height:${big?'56px':'22px'};border-radius:50%;border:2px solid black;background:${t.done?'#4ADE80':'white'};font-size:${big?'22px':'12px'};cursor:pointer;" onclick="toggleTodo('${t._key}')">${t.done?'✅':'⭕'}</button><span onclick="editTodo('${t._key}')" style="${t.done?'text-decoration:line-through;opacity:0.5':''}">${escapeHtml(t.title)} (${t.owner})</span><button onclick="deleteTodo('${t._key}')" style="background:#FF4444;color:white;border:none;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;">삭제</button></div>`;
  }).join('');
}

function renderSettings(){
  const wrap=document.getElementById('setWrap');
  let html='';

function changeMode(id){ cur=id; localStorage.setItem('curUser', id); renderTop(); renderSettings(); renderTodos(); renderChat(); goTab(id==='해준'?'todo':'chat'); toast(id+' 모드로 변경'); }
function escapeHtml(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.style.display='block'; setTimeout(()=>el.style.display='none',2500); }

function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim(); if(!txt) return;
  const msg={id:Date.now().toString(),author:cur,content:txt,source:'family',created_at:new Date().toISOString()};
  chatRef.push(msg);
  inp.value='';
}

function deleteMsg(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/messages/'+key).remove(); }
function editMsg(key){ 
  const msg=data.messages.find(m=>m._key===key); if(!msg) return;
  const nt=prompt('수정:', msg.content); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/messages/'+key).update({content:nt.trim()});
}
function addTodo(){
  const inp=document.getElementById('todoInput');
  const title=inp.value.trim(); if(!title) return;
  const todo={id:Date.now().toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()};
  todosRef.push(todo);
  inp.value='';
}
function toggleTodo(key){
  const t=data.todos.find(x=>x._key===key);
  if(t) db.ref('family/'+familyId+'/todos/'+key).update({done:!t.done});
}
function editTodo(key){
  const t=data.todos.find(x=>x._key===key); if(!t) return;
  const nt=prompt('수정:', t.title); if(!nt||!nt.trim()) return;
  db.ref('family/'+familyId+'/todos/'+key).update({title:nt.trim()});
}
function deleteTodo(key){ if(!confirm('삭제?')) return; db.ref('family/'+familyId+'/todos/'+key).remove(); }
function addSample(){
  ['이불 개기','양치 3분','가방 싸기'].forEach((title,i)=>{
    if(!data.todos.some(t=>t.title===title)){
      todosRef.push({id:(Date.now()+i).toString(),owner:'해준',title:title,done:false,source:'family',created_at:new Date().toISOString()});
    }
  });
}
function clearAll(){ if(!confirm('전체 삭제?')) return; chatRef.remove(); todosRef.remove(); }

chatRef.on('value', snap=>{
  const val=snap.val()||{};
  const msgs=Object.entries(val).map(([k,v])=>({_key:k, ...v})).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const wasLonger = msgs.length > data.messages.length;
  const last = msgs[msgs.length-1];
  const isNew = msgs.length > lastMsgCount && lastMsgCount !== 0;
  data.messages=msgs;
  renderChat();
  if(isNew && last && last.author!==cur){
    toast('📩 ' + last.author + ': ' + last.content.substring(0,20));
    triggerAlarm(last.author, last.content);
  }
  lastMsgCount = msgs.length;
  localStorage.setItem('lastMsgCount', msgs.length);
  document.getElementById('dot').className='dot';
  document.getElementById('liveText').textContent='🔥 실시간 연결됨 - 메시지 '+msgs.length+'개';
});

todosRef.on('value', snap=>{
  const val=snap.val()||{};
  data.todos=Object.entries(val).map(([k,v])=>({_key:k, ...v}));
  renderTodos();
});

function renderTopWrapper(){ renderTop(); }
renderTopWrapper(); goTab('chat');
lastMsgCount = parseInt(localStorage.getItem('lastMsgCount')||'0');
